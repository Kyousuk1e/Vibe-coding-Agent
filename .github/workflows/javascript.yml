name: JavaScript independent project
on:
  push:
    paths:
      - 'javascript/**'
      - '.github/workflows/javascript.yml'
  pull_request:
    paths:
      - 'javascript/**'
      - '.github/workflows/javascript.yml'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Copy only this project to an independent directory
        run: node -e "require('node:fs').cpSync('javascript', require('node:path').join(process.env.RUNNER_TEMP, 'minimal-agent-javascript'), { recursive: true })"
      - run: npm run check
        working-directory: ${{ runner.temp }}/minimal-agent-javascript
      - run: npm test
        working-directory: ${{ runner.temp }}/minimal-agent-javascript
